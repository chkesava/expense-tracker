[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,TWELVE_DATA_API_KEY,CRON_SECRET,FIREBASE_SERVICE_ACCOUNT_JSON"
  VITE_PUBLIC_APP_URL = "https://kesavaexpensetracker.netlify.app"

[functions."sip-execute"]
  schedule = "0 3 * * *"

[functions."credit-card-bills"]
  # 00:00 IST (18:30 UTC). Runs after the close day finishes so spend on day D is included.
  schedule = "30 18 * * *"

[[redirects]]
  from = "/api/stock"
  to = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from = "/api/historical"
  to = "/.netlify/functions/historical"
  status = 200

[[redirects]]
  from = "/api/mutual-funds"
  to = "/.netlify/functions/mutualFunds"
  status = 200

[[redirects]]
  from = "/api/crypto"
  to = "/.netlify/functions/crypto"
  status = 200

[[redirects]]
  from = "/api/sip-execute"
  to = "/.netlify/functions/sip-execute"
  status = 200

[[redirects]]
  from = "/api/credit-card-bills"
  to = "/.netlify/functions/credit-card-bills"
  status = 200

[[redirects]]
  from = "/api/app-distribution-invite"
  to = "/.netlify/functions/app-distribution-invite"
  status = 200

[[redirects]]
  from = "/api/twelve-data/*"
  to = "/.netlify/functions/twelve-data/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

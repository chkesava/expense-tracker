[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,TWELVE_DATA_API_KEY"
  VITE_PUBLIC_APP_URL = "https://kesavaexpensetracker.netlify.app"

[[redirects]]
  from = "/api/stock"
  to = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from = "/api/twelve-data/*"
  to = "/.netlify/functions/twelve-data/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
